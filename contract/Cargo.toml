[package]
name = "nearhearth"
version = "0.1.0"
edition = "2021"
description = "NEAR Hearth: EMBER, a NEP-141 memecoin with a fire the community keeps alive."
license = "MIT"
repository = "https://github.com/Nailer/nearhearth"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.0"
near-contract-standards = "=5.29.0"

[dev-dependencies]
near-sdk = { version = "=5.29.0", features = ["unit-testing"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
